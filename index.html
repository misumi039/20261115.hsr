<script>
const $=s=>document.querySelector(s),H0=540,H1=1140,ROWS=(H1-H0)/10;

const fmt=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');

const grp=n=>M.groups.find(g=>g.n===n)||{n,m:[],p:''};
const tt=s=>{if(s.g==='休憩')return s.t||s.g;let m=[];try{m=sm(s).filter(x=>!(M.absent||[]).includes(x))}catch(e){}if(m.length<3)return m.length?m.join('・'):s.g;return s.g};const isT=s=>!!s.tent||s.g==='個撮'&&![...slots.values()].some(o=>o!==s&&o.g==='個撮'&&sm(o)[0]===sm(s)[0]&&o.s>s.s);const tn=s=>tt(s)+(isT(s)?'（仮）':'');const setA=v=>document.querySelectorAll('#pa input').forEach(o=>o.checked=o.value===v);const getA=()=>(document.querySelector('#pa input:checked')||{}).value||'';const setP=v=>document.querySelectorAll('#pp input').forEach(o=>o.checked=o.value===v);const getP=()=>(document.querySelector('#pp input:checked')||{}).value||'';const sm=s=>Array.isArray(s.ms)?s.ms:grp(s.g).m;const setMem=a=>document.querySelectorAll('#pm input').forEach(o=>o.checked=a.includes(o.value));

function check(){
 const L=[...slots.values()].sort((a,b)=>a.s-b.s),E={},W={},el=[],wl=[];
 const put=(o,id,t)=>(o[id]=o[id]||[]).push(t),mem=sm;
 for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=L[i],b=L[j];
  if(!(a.s<b.e&&b.s<a.e))continue;
  const same=a.g===b.g,sh=same?[]:mem(a).filter(x=>mem(b).includes(x)),t=[];

  const pa=[a.p,...(a.ps||[])].filter(Boolean),pb=[b.p,...(b.ps||[])].filter(Boolean),sp=pa.filter(x=>pb.includes(x));if(sp.length)t.push('撮影者重複: '+sp.join('・'));
  if(!same&&a.l&&a.l===b.l)t.push('場所重複: '+a.l);
  if(!same&&a.a&&a.a===b.a)t.push('担当者重複: '+a.a);
  t.forEach(x=>{el.push(fmt(b.s)+' '+a.g+' と '+b.g+' → '+x);put(E,a.id,x);put(E,b.id,x)});}
 const w=(s,t)=>{put(W,s.id,t);wl.push(fmt(s.s)+' '+s.g+' → '+t)};
 L.forEach(s=>{const g=grp(s.g);if(g.p&&s.p&&![s.p,...(s.ps||[])].includes(g.p))w(s,'担当撮影者は'+g.p);if(!s.a&&sm(s).length&&(M.asst||[]).length&&L.some(x=>x.a))w(s,'担当者(アシスタント)が未設定')});
 M.members.forEach(n=>{const r=L.filter(s=>mem(s).includes(n));let run=1;
  for(let k=1;k<r.length;k++){const a=r[k-1],b=r[k],gap=b.s-a.e;if(gap<0)continue;run=gap<20?run+1:1;
   if(run>3)w(b,n+': 3枠連続で20分休憩なし');
   if(mem(a).length>=10&&gap<10)w(b,n+': 10人以上の枠の後に10分休憩なし');
   if(isOut(a.l)&&isOut(b.l)&&gap<10)w(b,n+': 屋外連続で10分休憩なし');
   }});
 M.phot.forEach(p=>{const r=L.filter(s=>s.p===p||(s.ps||[]).includes(p));for(let k=1;k<r.length;k++){const a=r[k-1],b=r[k],gap=b.s-a.e;if(gap>=0&&gap<10&&a.l&&b.l&&a.l!==b.l)w(b,p+': 場所移動で10分休憩なし')}});
 return{E,W,el,wl};}
const PCOL={'からす':'#E06666','ジャイロ':'#F1C232','鬼あさり':'#6D9EEB','やー':'#8E7CC3','Lyn':'#6AA84F'};
const CCOL={'アグライア':'#FFFFCC','トリビー':'#F4CCCC','モーディス':'#E6B8AF','キャストリス':'#D9D2E9','アナイクス':'#D9EAD3','ヒアンシー':'#EAD1DC','サフェル':'#CFE2F3','ファイノン':'#C9DAF8','セイレンス':'#D9D2E9','ケリュドラ':'#CFE2F3','長夜月':'#EAD1DC','丹恒·騰荒':'#D9EAD3','モモ':'#F4CCCC','デミウルゴス':'#EAD1DC','開拓者':'#D9D9D9'};
function brk(){const g=$('#grid'),ln=g.querySelectorAll('.lane');if(!ln.length)return;const H=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--H'))||19,l0=ln[0].offsetLeft,w=ln[ln.length-1].offsetLeft+ln[ln.length-1].offsetWidth-l0,t0=ln[0].querySelector('.hd').offsetHeight;[...slots.values()].filter(s=>s.g==='休憩').forEach(s=>{const d=document.createElement('div');d.className='brk';d.style.cssText='left:'+l0+'px;width:'+(w-4)+'px;top:'+(t0+(s.s-H0)/10*H)+'px;height:'+((s.e-s.s)/10*H-2)+'px';d.textContent=(s.t||'休憩')+'  '+fmt(s.s)+'-'+fmt(s.e);d.onclick=()=>{if(edit)open_(s)};g.appendChild(d)})}
function cn(s){return '';let m=[];try{m=sm(s).filter(x=>!(M.absent||[]).includes(x))}catch(e){}if(!m.length||(m.length===1&&m[0]===tt(s)))return '';const t=m.length<=3?m.join('・'):m.slice(0,2).join('・')+' ほか'+(m.length-2)+'人';return ' <span style="font-size:11px;opacity:.85">'+esc(t)+'</span>'}
function pcs(s){const band=PCOL[s.p]||'#b0b0b8',d=PCOL[(s.ps||[])[0]],ab=M.absent||[];let cs=[],n=0;try{const pm=sm(s).filter(m=>!ab.includes(m));n=pm.length;cs=[...new Set(pm.map(m=>CCOL[m]).filter(Boolean))]}catch(e){}
 let st='--pc:'+band+';border-left:6px solid '+band;
 if(!s.sub){const mx=c=>'color-mix(in srgb,'+c+' var(--bl),var(--bg))';
  st+=';background:'+mx({'からす':'#F4CCCC','ジャイロ':'#FFF2CC','鬼あさり':'#C9DAF8','やー':'#D9D2E9','Lyn':'#D9EAD3'}[s.p]||'#ECE8DC')}
 if(d)st+=';box-shadow:inset -5px 0 0 '+d+',0 1px 2px rgba(0,0,0,.12)';
 return st}
function render(){
 if(!M){$('#grid').innerHTML='<p class="note">マスタが未登録です</p>';return}
 const{E,W,el,wl}=check(),f=$('#ft').value;CK={E,W};const lv=true,keys=M.locs.map(l=>l.n).concat([...slots.values()].some(s=>!s.l&&s.g!=='休憩')?['']:[]);let h='<div class="tc"><div class="hd"></div><div class="body" style="height:calc(var(--H)*'+ROWS+')">';
 for(let m=H0;m<H1;m+=60)h+='<i style="top:calc(var(--H)*'+(m-H0)/10+')">'+fmt(m)+'</i>';
 h+='</div></div>';
 keys.forEach(p=>{h+='<div class="lane"><div class="hd">'+esc(p||'場所なし')+'</div><div class="body" data-p="'+esc(p)+'" style="height:calc(var(--H)*'+ROWS+')">';
  lst(p,lv).forEach(s=>{const e=E[s.id],w=W[s.id],mm=sm(s),d=0;
   h+='<div class="b '+(e?'e':w?'w':'')+(d?' d':'')+(s.sub?' sub':'')+(isT(s)?' tent':'')+'" data-id="'+s.id+'" title="'+esc((e||[]).concat(w||[]).concat(s.memo?['メモ: '+s.memo]:[]).join('\n'))+'" style="'+pcs(s)+';top:calc(var(--H)*'+(s.s-H0)/10+');height:calc(var(--H)*'+(s.e-s.s)/10+' - 2px)"><b>'+esc(tn(s))+'</b>'+cn(s)+' '+esc(lv?s.pp.join('・'):s.l||'')+'<br><small>'+(s.sub?'[サブ] ':'')+(s.a?'担当'+esc(s.a)+' ':'')+fmt(s.s)+'-'+fmt(s.e)+(mm.length?' '+mm.length+'人':'')+(e?' エラー:'+esc(e[0]):'')+(s.memo?'<br><span style="font-weight:600">メモ: '+esc(s.memo)+'</span>':'')+'</small></div>'});
  h+='</div></div>'});
 {const g_=$('#grid'),sx=g_.scrollLeft,sy=g_.scrollTop;g_.innerHTML=h+'<div id="now"></div>';g_.scrollLeft=sx;g_.scrollTop=sy;brk()}$('#grid').className=edit?'edit':'';$('#st').textContent='';
 const my=$('#my');$('#grid').style.display=f?'none':'';if(f){my.innerHTML=mine(f);my.hidden=false}else my.hidden=true;tick();
 $('#dt').hidden=!(el.length||wl.length);
 $('#sm').innerHTML='<span class="er">エラー '+el.length+'件</span> / 警告 '+wl.length+'件';
 $('#ls').innerHTML=el.map(x=>'<div class="er">'+esc(x)+'</div>').join('')+wl.map(x=>'<div>'+esc(x)+'</div>').join('');}
const opt=(a,v)=>a.map(x=>'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join('');
function fill(){if(!M)return;const v=$('#ft').value;
 const og=(t,l,k)=>l.length?'<optgroup label="'+k+'">'+l.map(x=>'<option value="'+t+':'+esc(x)+'">'+esc(t==='m'?nm(x):x)+'</option>').join('')+'</optgroup>':'';
 $('#ft').innerHTML='<option value="">全体を表示</option><option value="c:">声掛け一覧(開始時刻ごと)</option>'+og('m',M.members,'キャラクター')+og('p',M.phot,'カメラマン')+og('a',M.asst||[],'アシスタント');$('#ft').value=v;$('#pa').innerHTML=(M.asst||[]).map(x=>'<label><input type="checkbox" value="'+esc(x)+'"> '+esc(x)+'</label>').join(' ');$('#pa').onchange=e=>{if(e.target.checked)$('#pa').querySelectorAll('input').forEach(o=>{if(o!==e.target)o.checked=false})};
 $('#pp').innerHTML=M.phot.map(x=>'<label><input type="checkbox" value="'+esc(x)+'"> '+esc(x)+'</label>').join(' ');$('#pp').onchange=e=>{if(e.target.checked)$('#pp').querySelectorAll('input').forEach(o=>{if(o!==e.target)o.checked=false})};$('#pm').innerHTML='<b>被写体:</b> '+M.members.map(x=>'<label><input type="checkbox" value="'+esc(x)+'"> '+esc(nm(x))+((M.absent||[]).includes(x)?'(欠席)':'')+'</label>').join(' ');$('#pl').innerHTML='<option value="">場所なし</option>'+opt(M.locs.map(l=>l.n));
 $('#pg').innerHTML=opt(M.groups.map(g=>g.n));
 let t='';for(let m=H0;m<H1;m+=10)t+='<option value="'+m+'">'+fmt(m)+'</option>';$('#ps').innerHTML=t;
 let l='';for(let k=1;k<=12;k++)l+='<option value="'+k*10+'">'+k*10+'分</option>';$('#pe').innerHTML=l;}
function open_(s){cur=s;$('#pn').style.display='flex';setP(s.p);$('#ps').value=s.s;$('#pe').value=s.e-s.s;
 $('#pl').value=s.l||'';setA(s.a||'');$('#mo').value=s.memo||'';$('#tp').checked=!!s.tent;if(s.g)$('#pg').value=s.g;setMem(s.g?sm(s):grp($('#pg').value).m);$('#dl').style.display=s.id?'':'none';$('#dl').textContent='削除';delete $('#dl').dataset.ok}
$('#pg').onchange=()=>{const g=grp($('#pg').value);if(g.p)setP(g.p);setMem(g.m)};
$('#grid').onclick=e=>{const b=e.target.closest('.b');
 if(b){const s=slots.get(b.dataset.id);showInfo(s);return edit?open_(s):0}
 if(!edit)return;

function ask2(){const b=$('#dl');if(b.dataset.ok){delete b.dataset.ok;b.textContent='削除';return true}b.dataset.ok=1;b.textContent='本当に削除';setTimeout(()=>{delete b.dataset.ok;b.textContent='削除'},4000);return false}
const say=t=>{$('#st').textContent=t};
const fail=()=>say('保存できませんでした。トークンが正しいか、このリポジトリへの書き込み権限があるか確認してください。');
$('#sv').onclick=async()=>{const s=+$('#ps').value,d={s,e:s+ +$('#pe').value,g:$('#pg').value,p:getP(),l:$('#pl').value,a:getA(),ps:[],v:wv()};const mm_=$('#mo').value.trim();if(mm_)d.memo=mm_;if($('#tp').checked)d.tent=true;const mc=[...$('#pm').querySelectorAll('input:checked')].map(o=>o.value),gm=grp(d.g).m;if(!(mc.length===gm.length&&mc.every(x=>gm.includes(x))))d.ms=mc;
